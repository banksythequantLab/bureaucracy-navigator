services:
  navigator:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["bn-data:/data"]
    restart: unless-stopped
  sentinel:
    build: .
    env_file: .env
    volumes: ["bn-data:/data"]
    # daily 13:00 UTC; edit the schedule to taste
    command: sh -c "while true; do python -m packages.agents.sentinel; sleep 86400; done"
    restart: unless-stopped
volumes:
  bn-data:
